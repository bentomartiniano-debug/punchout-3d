<meta charset="utf-8">
<title>K.O.-RAMA Wiki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Outfit:wght@400;600;800&family=Press+Start+2P&display=swap">
<style>
/* Layout: tela única de seleção de lutador — elenco no topo; à esquerda placa + palco ao vivo; à direita a ficha em abas. Nada rola. */
:root{
  --k-ring:#110c18; --k-panel:#1b1426; --k-panel2:#251c34; --k-line:#3a2d52; --k-fg:#f7f1e6; --k-muted:#b2a5c6;
  --k-hot:#ff2d6f; --k-volt:#ffe14a; --k-cyan:#35e2d1; --k-ink:#07050b; --k-char:#ffe14a;
  --k-display:'Bangers','Impact','Arial Black',sans-serif; --k-body:'Outfit','Segoe UI',system-ui,sans-serif; --k-pixel:'Press Start 2P','Courier New',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
html{background:var(--k-ring)}
body{margin:0;background:var(--k-ring);color:var(--k-fg);font:400 15px/1.45 var(--k-body);padding:0 16px;overflow:hidden;
  background-image:radial-gradient(ellipse 70% 45% at 30% -10%,color-mix(in srgb,var(--k-char) 18%,transparent),transparent 70%),repeating-linear-gradient(90deg,transparent 0 47px,color-mix(in srgb,var(--k-line) 30%,transparent) 47px 48px)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--k-volt);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--k-display);font-weight:400;letter-spacing:.02em;text-wrap:balance;margin:0;line-height:1}
.eyebrow{font:600 11px/1 var(--k-body);letter-spacing:.14em;text-transform:uppercase;color:var(--k-muted)}

.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px;padding-block:8px 10px;max-width:1500px;margin:0 auto}
/* topo */
.top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.brand h1{font-size:30px;color:var(--k-volt);text-shadow:3px 3px 0 var(--k-hot),5px 5px 0 var(--k-ink);white-space:nowrap}
.rail{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:thin}
.chip-char{flex:0 0 auto;display:grid;grid-template-columns:36px auto;align-items:center;gap:7px;padding:3px 11px 3px 3px;border:2px solid var(--k-line);background:var(--k-panel);border-radius:9px;transform:skewX(-6deg);text-decoration:none;color:var(--k-fg)}
.chip-char>*{transform:skewX(6deg)}
.chip-char img{width:36px;height:36px;object-fit:contain;background:color-mix(in srgb,var(--c) 30%,var(--k-ink));border-radius:6px}
.chip-char b{font:400 17px/1 var(--k-display);letter-spacing:.03em;white-space:nowrap}
.chip-char[aria-current="page"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 24%,var(--k-panel));box-shadow:0 0 0 2px var(--k-ink),0 0 16px color-mix(in srgb,var(--c) 45%,transparent)}
.chip-rules{grid-template-columns:auto;padding:3px 13px;min-height:46px}
.chip-rules b{color:var(--k-volt)}

/* corpo da tela */
.screen{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:16px;min-height:0}
.left{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;min-height:0}
.nameplate{position:relative;background:var(--k-ink);border-radius:12px;padding:12px 14px;overflow:hidden;border:2px solid var(--k-ink)}
.nameplate::before{content:"";position:absolute;inset:0 auto 0 0;width:72%;background:var(--k-char);clip-path:polygon(0 0,100% 0,88% 100%,0 100%)}
.nameplate>*{position:relative}
.nameplate .title{font:400 16px/1 var(--k-display);color:var(--k-ink);letter-spacing:.05em}
.nameplate h2{font-size:clamp(30px,3.6vw,52px);color:#fff;text-shadow:3px 3px 0 var(--k-ink),-1px -1px 0 var(--k-ink),1px -1px 0 var(--k-ink),-1px 1px 0 var(--k-ink);margin:4px 0 8px}
.badges{display:flex;flex-wrap:wrap;gap:5px}
.badge{font:600 11px/1 var(--k-body);letter-spacing:.08em;text-transform:uppercase;padding:5px 8px;border-radius:999px;background:var(--k-ink);color:var(--k-fg);border:1px solid var(--k-line)}
.badge.size{background:var(--k-volt);color:var(--k-ink);border-color:var(--k-ink)}
.stage{position:relative;min-height:0;border-radius:12px;overflow:hidden;border:2px solid var(--k-ink);box-shadow:5px 5px 0 var(--k-ink);
  background:radial-gradient(ellipse 55% 16% at 50% 85%,color-mix(in srgb,var(--k-char) 32%,transparent),transparent 70%),linear-gradient(180deg,#1d1530 0%,#140f20 64%,#1f2a24 64.2%,#18211c 100%)}
.stage .view{position:absolute;inset:0;display:grid;place-items:center}
.stage .view svg{width:100%;height:100%;max-height:100%}
.stage .tag{position:absolute;left:10px;top:10px;z-index:2;font:400 18px/1 var(--k-display);background:var(--k-ink);color:var(--k-volt);padding:5px 9px;border-radius:6px;transform:rotate(-3deg)}
.stage .msg{position:absolute;inset:auto 12px 10px;z-index:2;font-size:13px;color:var(--k-muted);text-align:center}
.controls{display:grid;gap:7px;background:var(--k-panel);border:2px solid var(--k-ink);border-radius:12px;padding:9px}
.row{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.row .lbl{font:600 10px/1 var(--k-body);letter-spacing:.14em;text-transform:uppercase;color:var(--k-muted);min-width:60px}
.btn{border:2px solid var(--k-line);background:var(--k-panel2);border-radius:7px;padding:4px 8px;font-weight:600;font-size:13px;line-height:1.15}
.btn:hover{border-color:var(--k-muted)}
.btn[aria-pressed="true"]{background:var(--k-volt);color:var(--k-ink);border-color:var(--k-ink)}
.btn.sig{border-color:var(--k-hot);color:#ffd0dd}
.btn.sig[aria-pressed="true"]{background:var(--k-hot);color:#fff}
.skinpick{display:flex;gap:5px;flex-wrap:wrap}
.skinpick button{width:40px;height:40px;padding:2px;border:2px solid var(--k-line);border-radius:8px;background:color-mix(in srgb,var(--sc) 25%,var(--k-ink))}
.skinpick button[aria-pressed="true"]{border-color:var(--k-volt);box-shadow:0 0 0 2px var(--k-ink)}
.skinpick img{width:100%;height:100%;object-fit:contain}

/* painel em abas */
.right{display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px;min-height:0}
.tabs{display:flex;gap:5px;flex-wrap:wrap}
.tab{font:400 19px/1 var(--k-display);letter-spacing:.04em;padding:8px 13px;border-radius:9px;background:var(--k-panel);border:2px solid var(--k-line);transform:skewX(-6deg)}
.tab span{display:inline-block;transform:skewX(6deg)}
.tab[aria-selected="true"]{background:var(--k-char);color:var(--k-ink);border-color:var(--k-ink);box-shadow:3px 3px 0 var(--k-ink)}
.pane{min-height:0;overflow:auto;background:var(--k-panel);border:2px solid var(--k-ink);border-radius:14px;padding:16px 18px;box-shadow:5px 5px 0 var(--k-ink);scrollbar-width:thin}
.pane h3{font-size:30px;color:var(--k-char);text-shadow:2px 2px 0 var(--k-ink);margin-bottom:10px}
.pane p{margin:0}
.stack{display:grid;gap:12px;align-content:start}
.prose{display:grid;gap:10px;max-width:72ch}
.quote{font-size:18px;font-style:italic;border-left:4px solid var(--k-char);padding:2px 0 2px 12px;margin:0}
.callout{background:var(--k-panel2);border:2px solid var(--k-line);border-radius:10px;padding:10px 12px}
.callout strong{color:var(--k-volt)}
.note{font-size:12.5px;color:var(--k-muted)}
.stats{display:grid;gap:7px;background:var(--k-panel2);border-radius:10px;padding:12px;border:2px solid var(--k-line)}
.stat{display:grid;grid-template-columns:96px 1fr 34px;align-items:center;gap:10px}
.stat span{font:600 11px/1 var(--k-body);letter-spacing:.12em;text-transform:uppercase;color:var(--k-muted)}
.cells{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.cells i{height:13px;border-radius:2px;background:var(--k-line);transform:skewX(-14deg)}
.cells i.on{background:var(--k-cyan);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.stat b{font:400 10px/1 var(--k-pixel);text-align:right;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.rival{display:flex;gap:10px;align-items:center}
.rival img{width:44px;height:44px;object-fit:contain;border-radius:8px;background:var(--k-ink)}

.tablewrap{overflow-x:auto;border:2px solid var(--k-line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--k-line);vertical-align:top}
th{font:600 10px/1.2 var(--k-body);letter-spacing:.12em;text-transform:uppercase;color:var(--k-muted);background:var(--k-panel2)}
td:first-child{font-weight:800}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.phases{display:flex;flex-wrap:wrap;gap:6px}
.phase{padding:6px 10px;border-radius:8px;background:var(--k-panel2);border:2px solid var(--k-line);font-size:13px}
.phase b{font-family:var(--k-display);font-weight:400;font-size:16px;letter-spacing:.04em;margin-right:5px}

.skillgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
@media (max-width:1250px){.skillgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.skill{background:var(--k-panel2);border:2px solid var(--k-ink);border-radius:10px;padding:9px 10px;display:grid;gap:6px;align-content:start;min-width:0}
.skill header{display:flex;justify-content:space-between;gap:6px;align-items:start}
.skill h5{font:800 14.5px/1.15 var(--k-body);margin:0}
.skill .kind{font:600 10px/1 var(--k-body);letter-spacing:.12em;text-transform:uppercase;color:var(--k-muted)}
.tagchip{font:400 8px/1 var(--k-pixel);padding:5px 6px;border-radius:5px;background:var(--k-ink);color:var(--k-cyan);white-space:nowrap}
.keys{display:flex;gap:3px;flex-wrap:wrap;align-items:center}
.key{font:800 12px/1 var(--k-body);min-width:23px;height:23px;padding:0 5px;display:inline-grid;place-items:center;border-radius:5px;background:var(--k-fg);color:var(--k-ink);box-shadow:0 2px 0 var(--k-muted)}
.key.plus{background:none;color:var(--k-muted);box-shadow:none;min-width:auto;padding:0}
.skill p{font-size:12.5px;line-height:1.35}
.metrics{display:flex;flex-wrap:wrap;gap:4px}
.metric{font-size:11px;font-weight:600;padding:3px 6px;border-radius:5px;background:var(--k-panel);color:var(--k-muted);font-variant-numeric:tabular-nums}
.metric.hot{color:#ffd0dd;background:color-mix(in srgb,var(--k-hot) 22%,var(--k-panel))}
.metric.def{color:var(--k-ink);background:var(--k-volt)}

.sigcard{display:grid;gap:12px;background:var(--k-ink);border-radius:12px;padding:16px;border:2px solid var(--k-hot)}
.sigcard p{font-size:17px}
.sigcard .btn{justify-self:start}
.variants{display:grid;gap:8px}
.variants div{background:var(--k-panel2);border-radius:10px;padding:9px 12px;border:2px solid var(--k-line);font-size:14px}
.variants b{color:var(--k-volt)}

.skins{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:1250px){.skins{grid-template-columns:repeat(2,minmax(0,1fr))}}
.skin{background:var(--k-panel2);border:2px solid var(--k-ink);border-radius:12px;overflow:hidden;display:grid;grid-template-rows:auto 1fr;min-width:0;text-align:left;padding:0}
.skin[aria-pressed="true"]{border-color:var(--k-volt);box-shadow:0 0 0 2px var(--k-ink)}
.skin .art{aspect-ratio:4/3;max-width:100%;background:radial-gradient(circle at 50% 60%,color-mix(in srgb,var(--sc) 45%,transparent),var(--k-ink) 72%);display:grid;place-items:center}
.skin .art img{height:92%;width:auto;max-width:92%;object-fit:contain}
.skin .body{padding:8px 10px 10px;display:grid;gap:4px;align-content:start}
.skin h4{font-size:20px;letter-spacing:.03em;color:var(--sc2)}
.skin small{color:var(--k-muted);font-size:12px}
.skin q{font-style:italic;font-size:12.5px;line-height:1.35}

.tracks{display:grid;gap:10px}
.tape{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;background:var(--k-panel2);border:2px solid var(--k-line);border-radius:12px;padding:12px}
.reel{width:84px;height:54px;border-radius:8px;background:var(--k-ink);display:flex;gap:10px;align-items:center;justify-content:center;border:2px solid var(--k-line)}
.reel i{width:20px;height:20px;border-radius:50%;border:5px solid var(--k-volt);border-right-color:transparent;animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.reel i{animation:none}}
.tape h4{font-size:24px;color:var(--k-volt);letter-spacing:.03em;margin-bottom:3px}
.tape .meta{font-size:12px;color:var(--k-muted);margin-bottom:8px;word-break:break-word}
.tape blockquote{margin:0;font-style:italic;font-size:14px}

.legend{display:grid;gap:7px}
.legend div{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* telas estreitas: a ficha volta a rolar */
@media (max-width:900px){
  body{overflow:auto}
  .app{height:auto}
  .top{grid-template-columns:1fr}
  .screen{grid-template-columns:1fr}
  .left{grid-template-rows:auto auto auto}
  .stage{aspect-ratio:1/1;max-width:100%}
  .pane{overflow:visible}
  .skillgrid,.skins{grid-template-columns:1fr 1fr}
}
@media (max-width:520px){.skillgrid,.skins{grid-template-columns:1fr}.stat{grid-template-columns:78px 1fr 28px}}
</style>

<div class="app">
  <header class="top">
    <div class="brand"><h1>K.O.-RAMA WIKI</h1></div>
    <nav class="rail" id="rail" aria-label="Elenco"></nav>
  </header>
  <main class="screen" id="screen"></main>
</div>

<script>
(function(){
'use strict';
const W=JSON.parse(document.getElementById('wiki-data').textContent);
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=(v,d=1)=>Number(v).toLocaleString('pt-BR',{maximumFractionDigits:d});
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const byKey=Object.fromEntries(W.characters.map(c=>[c.key,c]));
const STAT_LABEL={forca:'Força',stamina:'Stamina',alcance:'Alcance',resistencia:'Resistência'};
const SIZE_LABEL={PEQUENUXO:'Pequenuxo',GRANDALHAO:'Grandalhão',NORMAL:'Tamanho normal'};
const SIZE_NOTE={PEQUENUXO:'Corpo menor e mais baixo no ringue.',GRANDALHAO:'Corpo maior; a câmera se afasta para enquadrar.',NORMAL:'Porte padrão do elenco.'};
let section=(()=>{try{return localStorage.getItem('korama-wiki-tab')||'Ficha'}catch(e){return 'Ficha'}})();
let rulesSection='Socos';

// ---------------------------------------------------------------- renderizadores (um script por skin) e movimentos (um JSON por personagem)
const scripts=new Map(),combats=new Map(),ready=new Map();
function loadScript(src){if(!scripts.has(src))scripts.set(src,new Promise((ok,bad)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>bad(Error('Não consegui carregar '+src));document.head.append(s);}));return scripts.get(src);}
function loadCombat(file){if(!combats.has(file))combats.set(file,fetch(file).then(r=>{if(!r.ok)throw Error('Não consegui carregar '+file);return r.json();}));return combats.get(file);}
function renderer(skin){
  if(!ready.has(skin.key))ready.set(skin.key,(async()=>{
    await loadScript(skin.script);
    const raw=window.KR[skin.key];
    const track=skin.combatFile?await loadCombat(skin.combatFile):null;
    return {fn:track?o=>raw({...o,combat:track}):raw,track};
  })());
  return ready.get(skin.key);
}
const hasAction=(track,a)=>!!track&&(a==='spin'||Object.keys(track.clips||{}).some(k=>k.endsWith('/'+a)));
function cycle(track,a){if(a==='spin')return 2.4;const c=track?.clips?.['base/F/'+a]||track?.clips?.['base/B/'+a]||Object.entries(track?.clips||{}).find(([k])=>k.endsWith('/'+a))?.[1];return c?c.duration+(c.loop?0:.45):6;}

// ---------------------------------------------------------------- palco
const stage={char:null,skin:null,view:'front',action:'idle',state:null,time:0,last:0,paintAt:0,playing:true,info:null,token:0};
async function paintStage(){
  const box=$('#stage-view');if(!box||!stage.skin)return;
  const token=stage.token;
  try{
    const r=stage.info||(stage.info=await renderer(stage.skin));
    if(token!==stage.token)return;
    const a=r.track&&hasAction(r.track,stage.action)?stage.action:null;
    const o={view:stage.view,expression:'normal',armed:true,shield:false,cone:false,time:stage.time,animate:!stage.skin.frames,action:a,actionDuration:a?cycle(r.track,a):undefined};
    o[stage.skin.param||'state']=stage.state??stage.skin.states?.[0]?.[0];
    box.innerHTML=r.fn(o);
    $('#stage-msg').textContent='';
  }catch(e){if(token===stage.token){box.innerHTML='';$('#stage-msg').textContent=e.message;}}
}
function loop(ts){
  requestAnimationFrame(loop);
  if(!stage.playing||document.hidden||!stage.skin){stage.last=ts;return;}
  if(ts-stage.paintAt<33)return;
  stage.time+=Math.min(.1,(ts-(stage.last||ts))/1000)||.033;stage.last=ts;stage.paintAt=ts;paintStage();
}
function setSkin(i){stage.skin=stage.char.skins[i];stage.info=null;stage.state=null;stage.token++;drawControls();paintStage();if(section==='Skins')drawPane();}
async function drawControls(){
  const c=stage.char,s=stage.skin;
  $('#skinpick').innerHTML=c.skins.map((k,i)=>`<button aria-pressed="${k===s}" data-pick="${i}" style="--sc:${k.color}" title="${esc(k.name)}" aria-label="Skin ${esc(k.name)}"><img src="${k.thumb}" alt=""></button>`).join('');
  for(const b of document.querySelectorAll('[data-view]'))b.setAttribute('aria-pressed',String(b.dataset.view===stage.view));
  $('#stage-tag').textContent=s.name;
  const states=(s.states||[]).length>1?s.states:[];
  $('#states-row').hidden=!states.length;
  $('#states').innerHTML=states.map(([v,l])=>`<button class="btn" data-state="${esc(v)}" aria-pressed="${String(String(stage.state??s.states[0][0])===String(v))}">${esc(l)}</button>`).join('');
  let info=null;try{info=await renderer(s);}catch(e){$('#stage-msg').textContent=e.message;}
  if(stage.skin!==s)return;
  const acts=W.actions.filter(([a])=>hasAction(info?.track,a));
  if(!acts.some(([a])=>a===stage.action))stage.action=acts[0]?.[0]||null;
  $('#actions').innerHTML='<span class="lbl">Movimento</span>'+(acts.length?acts.map(([a,l])=>`<button class="btn${a==='signature'?' sig':''}" data-act="${a}" aria-pressed="${a===stage.action}">${esc(l)}</button>`).join(''):'<span class="note">O Espantalho não ataca: escolha a reação em Forma.</span>');
}

// ---------------------------------------------------------------- conteúdo das abas
const cells=v=>{const on=Math.round(v/10);return '<div class="cells" aria-hidden="true">'+Array.from({length:10},(_,i)=>`<i class="${i<on?'on':''}"></i>`).join('')+'</div>';};
const keycaps=keys=>!keys.length?'<span class="metric">Sempre ativa</span>':'<span class="keys">'+keys.map(k=>k==='+'?'<span class="key plus">+</span>':`<span class="key">${esc(k)}</span>`).join('')+'</span>';
function metrics(s,char){
  const f=s.fx,m=[];
  const build=char.key==='boss'?char.build.findIndex(b=>b.includes(s.id)):(char.build.includes(s.id)?0:-1);
  if(build>=0)m.push(`<span class="metric def">${char.key==='boss'?'Fase '+(build+1):'Build padrão'}</span>`);
  if(s.type!=='Passiva'){const cost=f.heal?W.rules.healCost:s.type==='Modo'?W.rules.modeCost:W.rules.skillCost;m.push(`<span class="metric">${cost} stamina</span>`);}
  if(f.dmg)m.push(`<span class="metric hot">${fmt(f.dmg)} dano${f.hits>1?` · ${f.hits} golpes`:''}</span>`);
  if(f.burnSeconds)m.push(`<span class="metric hot">Queima ${fmt(f.burnDps)}/s · ${fmt(f.burnSeconds)} s</span>`);
  if(f.stun)m.push(`<span class="metric">Atordoa ${fmt(f.stun/60)} s</span>`);
  if(f.slow)m.push(`<span class="metric">Lentidão ${fmt(f.slow/60)} s</span>`);
  if(f.blind)m.push(`<span class="metric">Cegueira ${fmt(f.blind/60)} s</span>`);
  if(f.bleed)m.push(`<span class="metric hot">Sangra ${fmt(f.bleed/60)} s</span>`);
  if(f.mud)m.push(`<span class="metric">Sem esquiva ${fmt(f.mud/60)} s</span>`);
  if(f.drain)m.push(`<span class="metric">Drena ${fmt(f.drain)}</span>`);
  if(f.push)m.push(`<span class="metric">Empurra</span>`);
  if(f.heal)m.push(`<span class="metric">Cura ${fmt(f.heal)}</span>`);
  if(f.modeSeconds)m.push(`<span class="metric">Dura ${fmt(f.modeSeconds)} s</span>`);
  if(f.airborne)m.push(`<span class="metric">Invulnerável no ar</span>`);
  if(s.seconds)m.push(`<span class="metric">${fmt(s.seconds,2)} s</span>`);
  return m.join('');
}
const SECTIONS=['Ficha','Lore','Estilo de luta','Habilidades','Assinatura','Skins','Trilha'];
function sectionsFor(c){return SECTIONS.filter(t=>!(t==='Habilidades'&&!c.skills.length)&&!(t==='Trilha'&&!c.music.length));}
function paneFor(c,t){
  if(t==='Ficha'){
    const buildChips=c.key==='boss'?c.build.map((b,i)=>`<span class="badge">Fase ${i+1}: ${b.map(id=>esc(c.skills.find(s=>s.id===id)?.name||id)).join(' · ')}</span>`).join(''):c.build.map(id=>`<span class="badge">${esc(c.skills.find(s=>s.id===id)?.name||id)}</span>`).join('');
    return `<div class="stack"><p class="quote">“${esc(c.quote)}”</p>
      <div class="stats" aria-label="Atributos">${Object.entries(c.stats).map(([k,v])=>`<div class="stat"><span>${STAT_LABEL[k]}</span>${cells(v)}<b>${v}</b></div>`).join('')}
      <p class="note">Atributos da ficha do jogo. Aparecem nos menus, mas ainda não mudam dano, stamina, alcance ou defesa na luta.</p></div>
      <div class="duo"><div class="callout"><strong>Porte.</strong> ${SIZE_LABEL[c.size]}. ${SIZE_NOTE[c.size]}${c.key==='boss'?` Tem ${W.rules.bossHp} de vida e três estágios.`:''}</div>
      <div class="callout"><strong>Em uma frase.</strong> ${esc(c.style)}</div></div>
      ${c.build.length?`<div class="chips"><span class="eyebrow">${c.key==='boss'?'Builds por fase':'Build padrão'}</span>${buildChips}</div>`:''}</div>`;
  }
  if(t==='Lore'){
    const rivals=c.rivals.map(([k,txt])=>{const r=byKey[k];return `<div class="callout rival"><img src="${r.skins[0].thumb}" alt=""><div><strong>Rival: ${esc(r.name)}.</strong> ${esc(txt)}</div></div>`;}).join('');
    return `<h3>Lore</h3><div class="prose">${c.lore.map(p=>`<p>${esc(p)}</p>`).join('')}${rivals}</div>`;
  }
  if(t==='Estilo de luta'){
    return `<div class="stack"><p>${esc(c.style)}</p>
      ${c.patterns.length?`<div class="phases"><span class="phase"><b>Fase 1</b>acima de 60% de vida</span><span class="phase"><b>Fase 2</b>de 60% a 30%</span><span class="phase"><b>Fase 3</b>abaixo de 30% · avisos 15% mais curtos</span></div>
      <div class="tablewrap"><table><thead><tr><th>Golpe</th><th>Aviso</th><th>Resposta certa</th><th>Depois</th></tr></thead><tbody>${c.patterns.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:''}
      ${c.trap?`<div class="callout"><strong>Armadilha.</strong> ${esc(c.trap)}</div>`:''}
      ${c.phase3?`<div class="callout"><strong>Fase 3.</strong> ${esc(c.phase3)}</div>`:''}</div>`;
  }
  if(t==='Habilidades'){
    const order={Especial:0,Modo:1,Passiva:2};
    const list=[...c.skills].sort((a,b)=>order[a.type]-order[b.type]);
    return `<div class="stack"><div class="skillgrid">${list.map(s=>`<article class="skill"><header><div><div class="kind">${s.type}</div><h5>${esc(s.name)}</h5></div><span class="tagchip">${esc(s.tag)}</span></header>${keycaps(s.command.keys)}<p>${esc(s.desc)}</p><div class="metrics">${metrics(s,c)}</div></article>`).join('')}</div>
      <p class="note">${c.key==='boss'?'O Batalhator troca as três habilidades a cada queda que sofre.':'Equipa dois especiais (comando ou modo) e uma passiva. Com combo de 3 ou mais, qualquer especial custa '+W.rules.comboCost+' de stamina.'}</p></div>`;
  }
  if(t==='Assinatura'){
    const v=c.skins.filter(s=>s.signature).map(s=>`<div><b>${esc(s.name)}:</b> ${esc(s.signature)}</div>`).join('');
    return `<div class="stack"><div class="sigcard"><p>${esc(c.signature)}</p>${c.key!=='dummy'?'<button class="btn sig" id="see-sig">Tocar a assinatura no palco</button>':''}</div>${v?`<div class="variants">${v}</div>`:''}</div>`;
  }
  if(t==='Skins'){
    return `<div class="skins">${c.skins.map((s,i)=>`<button class="skin" data-pick="${i}" aria-pressed="${s===stage.skin}" style="--sc:${s.color};--sc2:${['#18181b','#171722'].includes(s.color)?'#f7f1e6':s.color}">
      <div class="art"><img src="${s.thumb}" alt=""></div>
      <div class="body"><span class="eyebrow">${i===0?'Visual original':'Skin '+i}</span><h4>${esc(s.name)}</h4><small>${esc(s.tagline)}</small><q>${esc(s.quote)}</q></div></button>`).join('')}</div>`;
  }
  if(t==='Trilha'){
    return `<div class="tracks">${c.music.map(m=>`<div class="tape"><div class="reel" aria-hidden="true"><i></i><i></i></div><div><h4>${esc(m.title)}</h4><div class="meta">${esc(m.file)} · insígnia: ${esc(m.insignia)}</div><blockquote>${esc(m.note)}</blockquote></div></div>`).join('')}</div>`;
  }
  return '';
}
function drawTabs(list,cur,attr){
  return list.map(t=>`<button class="tab" role="tab" ${attr}="${esc(t)}" aria-selected="${t===cur}"><span>${esc(t)}</span></button>`).join('');
}
function drawPane(){
  const c=stage.char;if(!c)return;
  const list=sectionsFor(c);if(!list.includes(section))section='Ficha';
  $('#tabs').innerHTML=drawTabs(list,section,'data-tab');
  $('#pane').innerHTML=paneFor(c,section);$('#pane').scrollTop=0;
}

// ---------------------------------------------------------------- telas
function characterScreen(c){
  document.documentElement.style.setProperty('--k-char',c.color);
  $('#screen').innerHTML=`
  <div class="left">
    <div class="nameplate"><div class="title">${esc(c.title)}</div><h2>${esc(c.name)}</h2>
      <div class="badges"><span class="badge size">${SIZE_LABEL[c.size]}</span><span class="badge">${esc(c.archetype)}</span></div></div>
    <div class="stage"><span class="tag" id="stage-tag"></span><div class="view" id="stage-view" role="img" aria-label="${esc(c.name)} animado"></div><div class="msg" id="stage-msg" aria-live="polite">Carregando…</div></div>
    <div class="controls">
      <div class="row"><span class="lbl">Skin</span><div class="skinpick" id="skinpick"></div>
        <span style="flex:1"></span><button class="btn" data-view="front">Frente</button><button class="btn" data-view="back">Costas</button><button class="btn" id="play">${stage.playing?'Pausar':'Animar'}</button></div>
      <div class="row" id="actions"><span class="lbl">Movimento</span></div>
      <div class="row" id="states-row"><span class="lbl">Forma</span><span id="states" class="row"></span></div>
    </div>
  </div>
  <div class="right"><div class="tabs" role="tablist" id="tabs" aria-label="Seções"></div><div class="pane" id="pane" role="tabpanel"></div></div>`;
  stage.char=c;stage.token++;stage.info=null;stage.skin=c.skins[0];stage.state=null;stage.view='front';stage.action='idle';stage.time=0;
  drawPane();drawControls();paintStage();
}
const RULES=['Socos','Mecânicas','Respostas certas','Comandos','Tamanhos','Hora do Show'];
function rulesPane(t){
  const R=W.rules;
  if(t==='Socos')return `<div class="stack"><div class="tablewrap"><table><thead><tr><th>Golpe</th><th>Dano base</th><th>Stamina</th><th>Duração</th><th>Atordoa</th><th>Alcance</th></tr></thead><tbody>${R.punches.map(p=>`<tr><td>${p.label}</td><td class="num">${p.damage}</td><td class="num">${p.cost}</td><td class="num">${fmt(p.seconds,2)} s</td><td class="num">${fmt(p.stun,2)} s</td><td class="num">${p.reach}</td></tr>`).join('')}</tbody></table></div>
    <div class="duo"><div class="callout"><strong>Carga.</strong> Segure o soco por até ${fmt(R.chargeSeconds)} s: o dano chega a 3× e o custo a 1,5×. Cheio, ele solta sozinho.</div><div class="callout"><strong>Partida.</strong> ${R.rounds} rounds de ${R.roundSeconds/60}:00. K.O. quando não levanta até 10, T.K.O. com ${R.tko} quedas no mesmo round, senão vence quem tiver mais vida.</div></div></div>`;
  if(t==='Mecânicas')return `<div class="duo">
    <div class="callout"><strong>Contra-ataque.</strong> Socar durante o aviso do rival dá 1,6× de dano (uppercut 1,35×; com Espírito Rebelde da Lady Espinha, 1,85×).</div>
    <div class="callout"><strong>Brecha.</strong> Depois do golpe mais forte, o rival fica aberto: +25% de dano e +30% de atordoamento, e ele não defende.</div>
    <div class="callout"><strong>Parry.</strong> Guarda nos primeiros 10 quadros (0,17 s) antes do golpe: devolve 20 de stamina, tira a exaustão e desequilibra o rival.</div>
    <div class="callout"><strong>Exaustão.</strong> Sem stamina, o soco sai 50% mais lento e com metade do dano, e quem soca fica vulnerável.</div>
    <div class="callout"><strong>Habilidades.</strong> Especial custa ${R.skillCost} de stamina, modo ${R.modeCost} e cura ${R.healCost}. Com combo de 3 ou mais, qualquer especial custa ${R.comboCost}.</div>
    <div class="callout"><strong>Fases da IA.</strong> Acima de 60% de vida o rival joga o básico; de 60% a 30% entra mais um golpe; abaixo de 30% os avisos ficam 15% mais curtos e as armadilhas aparecem mais.</div></div>`;
  if(t==='Respostas certas')return `<div class="tablewrap"><table><thead><tr><th>Vem aí</th><th>O que fazer</th></tr></thead><tbody>
    <tr><td>Gancho da direita</td><td>Esquivar para a esquerda (e vice-versa). Esquivar para o lado errado é apanhar.</td></tr>
    <tr><td>Uppercut</td><td>Abaixar ou esquivar para trás (↓↓ rápido).</td></tr>
    <tr><td>Golpe no corpo</td><td>Guarda.</td></tr>
    <tr><td>Agarrão (língua, harpão)</td><td>Só esquiva: a guarda não segura.</td></tr></tbody></table></div>`;
  if(t==='Comandos'){const cmds=[['← → + soco','De trás para frente'],['↓ ↑ + soco','Baixo e cima'],['Z + X','Os dois socos juntos (modos)'],['↑ ↑ + X','Duas vezes para cima e soco direito'],['↓ ↓ + Z','Duas vezes para baixo e soco esquerdo'],['← ← + Z','Duas vezes para trás e soco esquerdo'],['→ → + X','Duas vezes para frente e soco direito'],['← → + Z','Trás, frente e soco esquerdo']];
    return `<div class="callout legend">${cmds.map(([k,d])=>`<div>${keycaps(k.split(' '))}<span>${d}</span></div>`).join('')}<p class="note">Z é o soco esquerdo e X o direito. A sequência tem 1,2 s para ser completada.</p></div>`;}
  if(t==='Tamanhos')return `<div class="duo">${['PEQUENUXO','NORMAL','GRANDALHAO'].map(k=>`<div class="callout"><strong>${SIZE_LABEL[k]}.</strong> ${SIZE_NOTE[k]} ${W.characters.filter(c=>c.size===k).map(c=>esc(c.name)).join(', ')}.</div>`).join('')}</div>`;
  const m=W.menuTrack;return m?`<div class="tape"><div class="reel" aria-hidden="true"><i></i><i></i></div><div><h4>${esc(m.heading.split(' — ')[1]||m.heading)}</h4><div class="meta">${esc(m.file)} · trilha do menu</div><blockquote>${esc(m.note)}</blockquote></div></div>`:'';
}
function rulesScreen(){
  document.documentElement.style.setProperty('--k-char','#ffe14a');
  stage.char=null;stage.skin=null;stage.token++;
  $('#screen').innerHTML=`<div class="left" style="grid-template-rows:auto minmax(0,1fr)"><div class="nameplate"><div class="title">Como funciona uma luta</div><h2>Regras do ringue</h2>
    <div class="badges"><span class="badge size">${W.rules.rounds} rounds de ${W.rules.roundSeconds/60}:00</span><span class="badge">K.O. em 10</span><span class="badge">T.K.O. com ${W.rules.tko} quedas</span></div></div>
    <div class="callout" style="align-self:start"><strong>Como ler a wiki.</strong> Escolha um lutador no topo. À esquerda ele luta ao vivo com a arte e os movimentos do jogo; à direita as abas trazem ficha, lore, estilo de luta, habilidades, assinatura, skins e trilha. As setas ← → também trocam de aba.</div></div>
    <div class="right"><div class="tabs" role="tablist" id="tabs" aria-label="Seções"></div><div class="pane" id="pane" role="tabpanel"></div></div>`;
  const draw=()=>{$('#tabs').innerHTML=drawTabs(RULES,rulesSection,'data-rtab');$('#pane').innerHTML=rulesPane(rulesSection);};
  draw();rulesScreen.draw=draw;
}
function rail(cur){
  $('#rail').innerHTML=`<a class="chip-char chip-rules" href="#regras" ${cur==='regras'?'aria-current="page"':''}><b>Regras do ringue</b></a>`+
    W.characters.map(c=>`<a class="chip-char" href="#${c.key}" style="--c:${c.color}" ${cur===c.key?'aria-current="page"':''}><img src="${c.skins[0].thumb}" alt=""><b>${esc(c.name)}</b></a>`).join('');
  $('#rail').querySelector('[aria-current]')?.scrollIntoView({block:'nearest',inline:'center'});
}
function route(){
  const key=location.hash.slice(1),c=byKey[key];
  rail(c?key:key==='regras'?'regras':W.characters[0].key);
  if(key==='regras')rulesScreen();else characterScreen(c||W.characters[0]);
}

// ---------------------------------------------------------------- interação
$('#screen').addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.tab){section=t.dataset.tab;try{localStorage.setItem('korama-wiki-tab',section)}catch(_){}drawPane();}
  else if(t.dataset.rtab){rulesSection=t.dataset.rtab;rulesScreen.draw();}
  else if(t.dataset.pick!==undefined)setSkin(+t.dataset.pick);
  else if(t.dataset.view){stage.view=t.dataset.view;drawControls();paintStage();}
  else if(t.dataset.state!==undefined){const v=t.dataset.state;stage.state=/^\d+$/.test(v)?+v:v;drawControls();paintStage();}
  else if(t.dataset.act){stage.action=t.dataset.act;stage.time=0;for(const b of document.querySelectorAll('[data-act]'))b.setAttribute('aria-pressed',String(b===t));paintStage();}
  else if(t.id==='play'){stage.playing=!stage.playing;t.textContent=stage.playing?'Pausar':'Animar';}
  else if(t.id==='see-sig'){stage.action='signature';stage.time=0;stage.playing=true;$('#play').textContent='Pausar';drawControls();paintStage();}
});
addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea')||e.altKey||e.ctrlKey||e.metaKey)return;
  if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;
  const rules=!stage.char,list=rules?RULES:sectionsFor(stage.char),cur=rules?rulesSection:section;
  const i=(list.indexOf(cur)+(e.key==='ArrowRight'?1:-1)+list.length)%list.length;
  if(rules){rulesSection=list[i];rulesScreen.draw();}else{section=list[i];try{localStorage.setItem('korama-wiki-tab',section)}catch(_){}drawPane();}
  e.preventDefault();
});
addEventListener('hashchange',route);
route();
requestAnimationFrame(loop);
})();
</script>
