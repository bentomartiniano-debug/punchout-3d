<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K.O.-RAMA 3D · Visualizador</title>
<style>
  :root{--bg:#120d1a;--panel:#1c1528;--line:#3a2d52;--fg:#f4efe6;--muted:#a99cbd;--volt:#ffe14a;--hot:#ff2d6f}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.4 'Segoe UI',system-ui,sans-serif;overflow:hidden}
  #app{display:grid;grid-template-columns:1fr 300px;height:100%}
  canvas{display:block;width:100%;height:100%}
  aside{background:var(--panel);border-left:2px solid #000;padding:12px;overflow:auto;display:grid;gap:12px;align-content:start}
  h1{font:800 18px/1 'Segoe UI';margin:0;color:var(--volt)}
  h2{font:700 11px/1 'Segoe UI';letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
  .row{display:flex;flex-wrap:wrap;gap:5px}
  button{font:600 13px 'Segoe UI';color:var(--fg);background:#2a2040;border:2px solid var(--line);border-radius:7px;padding:5px 9px;cursor:pointer}
  button:hover{border-color:var(--muted)} button.on{background:var(--volt);color:#000;border-color:#000}
  label{display:grid;grid-template-columns:110px 1fr 40px;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
  input[type=range]{width:100%}
  #status{font-size:12px;color:var(--muted);white-space:pre-wrap}
</style>

</head>

      <div id="crabEyeCtl" style="display:none">

      <label>Olho siri ↕ <input id="ceY" type="range" min="-0.12" max="0.12" step="0.002" value="0"><span></span></label>

      </div>
      <label>Boca frente <input id="mouthLift" type="range" min="0" max="0.05" step="0.001" value="0.020"><span></span></label>
    </div>
    <div><h2>Visual</h2>

      <label>Quadros/s animação <input id="animFps" type="range" min="8" max="60" step="1" value="12"><span></span></label>

    </div>
    <div id="status">Carregando…</div>
  </aside>
</div>
<script type="module">

          headR: 0.22, gloveR: 0.12, gloveSink: -0.01, guard: [0.27, 0.27, 0.46],   /* braços quase esticados (cotovelo pouco dobrado), punhos à frente na altura do peito */

  joana: { name: 'Joana Cara-de-Craca', dir: 'joana', body: 'body_joana.glb', gloves: ['prop_joana_hook_L.glb', 'prop_joana_claw_R_pinca.glb'], claw: { side: 'R', dir: -1, closed: 0.3 },   /* pinça móvel separada (separar_pinca.py) */ gloveScale: 1, gloveTwist: [Math.PI, Math.PI],   /* meia volta: gancho virado para dentro, garra desvirada */
          hat: 'prop_joana_hat_tras.glb', hatScale: 1.4, hatWorldY: 1.6, hatTilt: 8, sc: 0.81, frogStuff: false, eyeStyle: 'human', noEyes: true, mouthW: 1.2, nostrils: false,
          wig: { file: 'prop_joana_dreads_codigo.glb', tips: true },
          crabEye: { pos: [-0.3529, 1.6288, 0.2298], dx: -0.002, dy: 0.010, size: 0.06 },   /* centro da pupila do olho de siri (pintar_olho_siri.py): pupila desenhada, X no K.O. */   /* dreads feitos por código (make_joana_dreads.py): raiz presa sob a aba, só as pontas balançam */ headR: 0.22, gloveR: 0.18, gloveSink: -0.1,
          face: { eyeX: 0.08, eyeY: 0.0, eyeZ: -0.03, eyeS: 0.12, mouthY: -0.195, mouthLift: 0.01 } },
  jack: { name: 'Jack Mãos de Colmeia', dir: 'jack', body: 'body_jack.glb', gloves: ['prop_jack_hive_L.glb', 'prop_jack_hive_R.glb'], gloveScale: 1, gloveTwist: 0,
          hat: 'prop_jack_hat.glb', hatScale: 1.15, hatDrop: -0.13, hatWorldY: 1.165, hatTilt: 12, guard: [0.42, 0.16, 0.3], /* guarda baixa, colmeias perto do corpo: cotovelo dobrado */ holesUp: true, headR: 0.2, gloveR: 0.16,
          outfit: { honey: '#e8b13a', backR: 0.05, backY: 0.84, shirt: '#d9a441', skin: '#f0c3ac', neckY: 0.935, coreHalfW: 0.09, shirtHex: 0.036, shirtHalfW: 0.13, shirtY0: 0.598, shirtY1: 1.02, hex: '#26401d', hexCell: 0.032, hexFrom: 0.55 }, sc: 0.67, frogStuff: false, eyeStyle: 'sprite', mouthW: 1.48,
          hair: { brimY: 1.165, crownR: 0.145, crownH: 0.16 }, sway: true,   // o chapéu prende o cabelo: nada atravessa
          atlas: '../../engine-cpp/assets/sprites/jack.png',
          face: { eyeX: 0.075, eyeY: -0.03, eyeZ: -0.055, eyeS: 0.18, mouthY: -0.163, mouthLift: 0.008 }, nostrils: false },
};
const CHAR = CHARS[new URLSearchParams(location.search).get('p')] || CHARS.frog;
const SC = CHAR.sc;   // escala das distâncias de golpe/guarda pelo porte (o sapo tem 2,15 m)
const ASSETS = `../../assets3d/${CHAR.dir}/clean/`;
const $ = s => document.querySelector(s);
const status = t => ($('#status').textContent = t);

// ---------------------------------------------------------------- cena, ringue, câmera
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(1.5, devicePixelRatio));
renderer.outputColorSpace = THREE.SRGBColorSpace;
$('#view').append(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#1a1426');
const camera = new THREE.PerspectiveCamera(34, 1, 0.05, 100);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.25, 0);
scene.add(new THREE.HemisphereLight('#ffffff', '#3a3050', 0.55));
const sun = new THREE.DirectionalLight('#ffffff', 2.6);
sun.position.set(3.5, 4, 3);
scene.add(sun);
// cenário: o lutador fica parado no centro e é o ringue que gira na passada (como no jogo)
const stage = new THREE.Group(); scene.add(stage);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), new THREE.MeshToonMaterial({ color: '#2c4a3a' }));
floor.rotation.x = -Math.PI / 2; stage.add(floor);
const apron = new THREE.Mesh(new THREE.PlaneGeometry(9.8, 9.8).rotateX(-Math.PI / 2), new THREE.MeshToonMaterial({ color: '#3b6b52' }));
apron.position.y = 0.002; stage.add(apron);
const ringLine = new THREE.Mesh(new THREE.RingGeometry(1.1, 1.16, 48), new THREE.MeshBasicMaterial({ color: '#ffe14a' }));
ringLine.rotation.x = -Math.PI / 2; ringLine.position.y = 0.004; stage.add(ringLine);
const postMat = new THREE.MeshToonMaterial({ color: '#d9d9d9' }), padMat = new THREE.MeshToonMaterial({ color: '#c0392b' });
const ropeCols = ['#e8e8e8', '#c0392b', '#2f6fd6'];
for (const [x, z] of [[-4.9, -4.9], [4.9, -4.9], [4.9, 4.9], [-4.9, 4.9]]) {
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 1.6, 12), postMat); post.position.set(x, 0.8, z); stage.add(post);
  const pad = new THREE.Mesh(new THREE.BoxGeometry(0.2, 1.0, 0.2), padMat); pad.position.set(x, 0.95, z); stage.add(pad);
}
for (let i = 0; i < 3; i++) {
  const y = 0.55 + i * 0.38, m = new THREE.MeshToonMaterial({ color: ropeCols[i] });
  for (const [a, b] of [[[-4.9, -4.9], [4.9, -4.9]], [[4.9, -4.9], [4.9, 4.9]], [[4.9, 4.9], [-4.9, 4.9]], [[-4.9, 4.9], [-4.9, -4.9]]]) {
    const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
    const rope = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, len, 8).rotateZ(Math.PI / 2), m);
    rope.position.set((a[0] + b[0]) / 2, y, (a[1] + b[1]) / 2); rope.rotation.y = -Math.atan2(b[1] - a[1], b[0] - a[0]); stage.add(rope);
  }
}
const CAMS = { ring: [[0, 2.2, 4.6], [0, 1.4, 0]], front: [[0, 1.3, 4.2], [0, 1.1, 0]], side: [[6.2, 1.5, 1.2], [0, 1.15, 0.3]], back: [[0, 1.6, -4.2], [0, 1.1, 0]] };
function setCam(k) { const [p, t] = CAMS[k]; camera.position.set(...p); controls.target.set(...t); controls.update(); }
setCam('ring');
function resize() { const w = $('#view').clientWidth, h = $('#view').clientHeight; renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
// contorno de tela: renderiza a cena com profundidade e desenha tinta onde a profundidade quebra
const rt = new THREE.WebGLRenderTarget(1, 1, { stencilBuffer: true });   // estêncil: o interior da boca só aparece pela abertura
rt.depthTexture = new THREE.DepthTexture(1, 1, THREE.UnsignedInt248Type); rt.depthTexture.format = THREE.DepthStencilFormat;
const lineWidth = { value: 3.2 };
const creaseU = { value: 0.0035 };   // limiar do vinco (0 = desliga)
const post = new THREE.ShaderMaterial({
  uniforms: { tColor: { value: rt.texture }, tDepth: { value: rt.depthTexture }, px: { value: new THREE.Vector2(1, 1) }, w: lineWidth, crease: creaseU, near: { value: 0.05 }, far: { value: 100 }, ink: { value: new THREE.Color('#0b0710') } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
  fragmentShader: `uniform sampler2D tColor, tDepth; uniform vec2 px; uniform float w, near, far, crease; uniform vec3 ink; varying vec2 vUv;
    float lin(vec2 uv){ float z = texture2D(tDepth, uv).x * 2.0 - 1.0; return 2.0 * near * far / (far + near - z * (far - near)); }
    void main(){
      vec4 c = texture2D(tColor, vUv); float d = lin(vUv), e = 0.0;
      for (int i = 0; i < 8; i++) { float a = float(i) * 0.785398; vec2 o = vec2(cos(a), sin(a)) * px * w; float dn = lin(vUv + o); e = max(e, (dn - d) / d); }
      float line = smoothstep(0.012, 0.03, e);
      // vinco: quina viva no meio da superfície (borda da fivela, beira do casaco, degrau do cinto). A profundidade
      // muda de inclinação de repente -> segunda derivada alta. Superfície curva lisa quase não acusa.
      if (crease > 0.0) {
        float k = 0.0; vec2 s1 = px * max(1.0, w * 0.45);
        for (int i = 0; i < 4; i++) { float a = float(i) * 0.785398; vec2 o = vec2(cos(a), sin(a)) * s1;
          float d1 = lin(vUv + o), d2 = lin(vUv - o); k = max(k, abs(d1 + d2 - 2.0 * d) / d); }
        line = max(line, smoothstep(crease, crease * 1.8, k));
      }
      gl_FragColor = vec4(mix(c.rgb, ink, line), 1.0);
      #include <colorspace_fragment>
    }`,
  depthTest: false, depthWrite: false,
});
const postScene = new THREE.Scene(), postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), post));
function resizeRT() { const w = renderer.domElement.width, h = renderer.domElement.height; rt.setSize(w, h); rt.depthTexture.image.width = w; rt.depthTexture.image.height = h; post.uniforms.px.value.set(1 / w, 1 / h); }
addEventListener('resize', () => { resize(); resizeRT(); }); resize(); resizeRT();

// ---------------------------------------------------------------- toon + contorno que acompanha o esqueleto
const ramp = new THREE.DataTexture(new Uint8Array([90, 90, 90, 255, 175, 175, 175, 255, 255, 255, 255, 255]), 3, 1, THREE.RGBAFormat);
ramp.minFilter = ramp.magFilter = THREE.NearestFilter; ramp.needsUpdate = true;
const outlineUniform = { value: 0.013 };
const OUTLINE_MODE = 'tela';   // 'tela' = linha por quebra de profundidade (espessura uniforme); 'casca' = casca invertida
// sombra de quadrinho: dois tons duros e retícula (pontos em tela, a 45°) que cresce em direção à sombra
const comic = { cell: { value: 7.0 }, shade: { value: 0.58 }, dots: { value: 0.55 } };
function comicShader(mat) {
  mat.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, { uCell: comic.cell, uShade: comic.shade, uDots: comic.dots });
    sh.fragmentShader = 'uniform float uCell, uShade, uDots;' + String.fromCharCode(10) + 'float gTone = 0.0;' + String.fromCharCode(10) + sh.fragmentShader
      .replace('#include <gradientmap_pars_fragment>', `
        vec3 getGradientIrradiance(vec3 normal, vec3 lightDirection) {
          float d = dot(normal, lightDirection);
          gTone = max(gTone, clamp((0.30 - d) / 0.55, 0.0, 1.0));   // 0 = luz, 1 = sombra
          return vec3(d > 0.12 ? 1.0 : uShade);                     // corte duro
        }`)
      .replace('#include <opaque_fragment>', `
        vec2 g = gl_FragCoord.xy / uCell;
        g = mat2(0.7071, -0.7071, 0.7071, 0.7071) * g;
        float r = length(fract(g) - 0.5);
        float dotR = 0.62 * sqrt(gTone);                              // pontos crescem rumo à sombra
        float dotMask = 1.0 - smoothstep(dotR - 0.05, dotR + 0.05, r);
        outgoingLight *= mix(1.0, uDots, dotMask * step(0.02, gTone));
        #include <opaque_fragment>`);
  };
  return mat;
}
const papoSkin = { c: { value: new THREE.Vector3(0, 1.66, 0.3) }, r: { value: new THREE.Vector2(0.4, 0.23) }, amt: { value: 0 } };
const belly = {
  color: { value: new THREE.Color('#a8c97f') },
  c: { value: new THREE.Vector2(0, 1.42) },      // centro (x, altura) no corpo em repouso
  r: { value: new THREE.Vector2(0.34, 0.5) },    // meia-largura, meia-altura
  floor: { value: 0.97 },                        // não desce para a bermuda
  ceil: { value: 1.79 },                         // não sobe além do papo (a boca fica logo acima)
};
function bellyShader(mat) {
  const prev = mat.onBeforeCompile;
  mat.onBeforeCompile = (sh, r) => {

// Tempos do jogo (engine-cpp a 60 quadros/s): socos jab 28, direto 32, gancho 38, corpo 34, uppercut 48 (engine.cpp);

// Ritmo do soco (tempo real -> tempo das chaves): prepara, dispara acelerando até o impacto (velocidade máxima no
// contato), segura um instante no impacto e volta devagar no começo e acelerando até a guarda (easy in).
function punchTime(keys, p) {

    keys.forEach((k, i) => { const m = Math.hypot(...k[1]); if (m > best + 1e-6) { best = m; iImp = i; } });
    keys._imp = { tA: keys[Math.max(0, iImp - 2)][0], tI: keys[iImp][0] };

  if (p < a + sI) { const u = (p - a) / sI; return tA + (tI - tA) * u * u; }
  if (p < c) return tI;
  const u = (p - c) / (1 - c);
  return tI + (1 - tI) * u * u;
}
// interpolação cúbica de Hermite com tangentes de Catmull-Rom (passa pelas chaves sem parar nelas)

  const v = j => ch(k0[1][j], k1[1][j], k2[1][j], k3[1][j]);
  const s = j => ch(k0[j], k1[j], k2[j], k3[j]);

}

    for (const sd of ['L', 'R']) {
      const sx = sd === 'L' ? 1 : -1;
      g[sd].add(new THREE.Vector3(sx * 0.06 * tl2, -0.2 * tl2, -0.04 * tl2)).add(new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, 0).multiplyScalar(0.012 * tl2));
    }
  }
  // a luva nunca entra na cabeça: se o alvo cair dentro da esfera da cabeça, empurra para fora (e para a frente)
  if (CHAR.headR) {
    const hc = bones.Head.getWorldPosition(new THREE.Vector3()).add(new THREE.Vector3(0, CHAR.headR * 0.35, 0));
    for (const k of ['L', 'R']) {
      const d = g[k].clone().sub(hc), need = CHAR.headR + CHAR.gloveR;
      if (d.length() < need) { if (d.z < 0.05) d.z = 0.05; g[k].copy(hc).addScaledVector(d.normalize(), need); }
    }
  }
  for (const k of ['L', 'R']) {
    const side = k === 'L' ? 'Left' : 'Right';
    // braço volta ao repouso antes do IK: senão a torção vai acumulando de um quadro para o outro e o
    // antebraço vira um "pacote de bala" (fica fininho torcido)
    for (const b of ['Arm', 'ForeArm', 'Hand']) { const r = rest.get(bones[side + b]); if (r) bones[side + b].quaternion.copy(r.q); }
    bones[side + 'Arm'].updateMatrixWorld(true);
    const sh = new THREE.Vector3(); bones[side + 'Arm'].getWorldPosition(sh);
    const pl = CHAR.pole || [0.55, -0.7, -0.35];
    pole.copy(sh).add(new THREE.Vector3(k === 'L' ? pl[0] : -pl[0], pl[1], pl[2]));   // cotovelo para fora, para baixo e para trás
    if (move === 'upper' && pose.side === k) pole.lerp(sh.clone().add(new THREE.Vector3(k === 'L' ? 0.2 : -0.2, -0.9, 0.35)), bump(pose.p));   // uppercut: cotovelo por baixo
    solveIK(bones[side + 'Arm'], bones[side + 'ForeArm'], bones[side + 'Hand'], g[k], pole);
    // luva: punho no alvo, nós dos dedos apontando para onde o golpe vai
    const hand = new THREE.Vector3(), fore = new THREE.Vector3(); bones[side + 'Hand'].getWorldPosition(hand); bones[side + 'ForeArm'].getWorldPosition(fore);
    const dir = hand.clone().sub(fore).normalize();
    gloves[k].position.copy(hand).addScaledVector(dir, GLOVE_SINK);   // a malha não tem mão: o toco do pulso entra na boca da luva
    // giro do punho: na guarda e no uppercut as costas da mão olham para a frente (dedos voltados para ele);
    // nos socos retos e no gancho as costas da mão viram para cima (palma para baixo)
    const yq = new THREE.Quaternion().setFromAxisAngle(UP, THREE.MathUtils.degToRad(pose.yaw * 0.8));
    let zRef = FWD.clone().applyQuaternion(yq);
    if (pose.glove && pose.side === k && move !== 'upper') zRef.lerp(UP, bump(Math.min(1, pose.p * 1.6)));
    if (CHAR.fistForward && !(pose.glove && pose.side === k)) {   // guarda: punho apontando reto para a frente (não segue o antebraço torto)
      dir.lerp(new THREE.Vector3(0, -0.15, 1).normalize().applyQuaternion(yq), CHAR.fistForward).normalize();
    }
    zRef.negate();   // o +Z do modelo da luva é o lado da palma: aponta para ele (guarda/uppercut) ou para baixo (socos)
    if (CHAR.palmsIn && !(pose.glove && pose.side === k)) zRef.set(k === 'L' ? -1 : 1, 0, 0).applyQuaternion(yq);   // guarda: palmas para dentro
    if (CHAR.holesUp) zRef.set(k === 'L' ? -0.35 : 0.35, 1, 0).normalize();   // colmeia: furos (+Z do modelo) para cima, levemente inclinados para dentro
    const zA = zRef.addScaledVector(dir, -zRef.dot(dir)).normalize(), xA = new THREE.Vector3().crossVectors(dir, zA);
    gloves[k].quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(xA, dir, zA));
    if (umbrellas) {   // guarda-chuva no punho: na guarda aberto e inclinado para fora (escudo ao lado, rosto livre); no soco aponta para a frente e fecha
      const u = umbrellas[k], side = k === 'L' ? 1 : -1, hit = pose.glove && pose.side === k;
      const d = new THREE.Vector3(side * 0.55, 0.12, 0.83).normalize().applyQuaternion(yq);
      if (hit) d.lerp(FWD.clone().applyQuaternion(yq).add(new THREE.Vector3(0, 0.1, 0)).normalize(), Math.min(1, pose.p * 2.5)).normalize();
      // o punho gira no eixo do antebraço até o furo dos dedos (eixo X dele) ficar na direção do guarda-chuva; o cabo passa ali
      // o pulso dobra (até 45°) para o punho ficar de través ao guarda-chuva: a haste sai na direção pedida
      const yIdeal = dir.clone().addScaledVector(d, -dir.dot(d)).normalize();
      const bend = Math.min(1, THREE.MathUtils.degToRad(45) / Math.max(1e-3, dir.angleTo(yIdeal)));
      const yF = dir.clone().lerp(yIdeal, bend).normalize();
      const xU = d.clone().addScaledVector(yF, -d.dot(yF)).normalize(), zU = new THREE.Vector3().crossVectors(xU, yF);
      gloves[k].quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(xU, yF, zU));
      u.position.copy(gloves[k].position).addScaledVector(yF, 0.075 * CHAR.gloveScale); u.quaternion.setFromUnitVectors(UP, xU);
      const goal = crownFly ? 0.4 : hit ? 0 : 1, opening = goal > umbOpen[k];
      const kk = opening ? 90 : 260, cc = opening ? 15 : 24;
      for (let i = 0; i < 4; i++) { const h = dt / 4; umbVel[k] += (kk * (goal - umbOpen[k]) - cc * umbVel[k]) * h; umbOpen[k] += umbVel[k] * h; }
      u.userData.setOpen(THREE.MathUtils.clamp(umbOpen[k], 0, 1.05));
    }
    if (CHAR.gloveTwist) gloves[k].quaternion.multiply(new THREE.Quaternion().setFromAxisAngle(UP, Array.isArray(CHAR.gloveTwist) ? CHAR.gloveTwist[k === 'L' ? 0 : 1] : (k === 'L' ? CHAR.gloveTwist : -CHAR.gloveTwist)));   // [L, R]: giro de cada peça no eixo do antebraço
  }
  // garra da Joana: a pinça (nó 'pinca', origem na dobradiça) abre e fecha — tique na guarda, fecha no impacto, solta no K.O.
  if (CHAR.claw) {
    const pin = gloves[CHAR.claw.side] && gloves[CHAR.claw.side].getObjectByName('pinca');
    if (pin) {
      // ângulo de abertura (0 = fechada, pontas encostadas); mola com rebote: abre rápido e fecha num estalo que quica
      clawT += dt;
      let open;
      if (crownFly) open = 0.6;                                                             // K.O.: aberta e mole
      else if (pose.glove && pose.side === CHAR.claw.side) open = pose.p < 0.4 ? 0.75 : 0;   // abre no preparo, fecha no impacto
      else {   // tique da guarda: abre devagar, segura, fecha num estalo; às vezes estala duas vezes
        const ph = clawT % 3.2, dbl = Math.floor(clawT / 3.2) % 3 === 1;
        open = (ph < 0.7 || (dbl && ph > 1.3 && ph < 1.9)) ? 0.65 : 0;
      }
      // a pose anda em quadros espaçados (animFps ~11): o movimento tem de durar vários quadros para não "teleportar".
      // abrindo: mola macia (~0,45 s, sem quicar); fechando: mola rápida e pouco amortecida (estalo que quica ~0,4 s); K.O.: mole
      const opening = open > clawA, k = crownFly ? 40 : opening ? 60 : 180, c = crownFly ? 5 : opening ? 13 : 12;
      for (let i = 0; i < 4; i++) { const h = dt / 4; clawV += (k * (open - clawA) - c * clawV) * h; clawA += clawV * h; }
      pin.rotation.x = CHAR.claw.dir * (clawA - CHAR.claw.closed);
    }
  }
  lavaU.time.value += dt;
  if (skirtMesh) {   // coxas no espaço da malha da saia (para o shader empurrar o pano para fora delas)
    const inv = skirtMesh.matrixWorld.clone().invert(), sc = skirtMesh.getWorldScale(new THREE.Vector3()).x;
    ['Left', 'Right'].forEach((sd, i) => {
      skirtLeg.a.value[i].copy(bones[sd + 'UpLeg'].getWorldPosition(new THREE.Vector3())).applyMatrix4(inv);
      skirtLeg.b.value[i].copy(bones[sd + 'Leg'].getWorldPosition(new THREE.Vector3())).applyMatrix4(inv);
    });
    skirtLeg.r.value = (CHAR.skirt.legR || 0.11) / sc;
  }
  if (skirt) {   // barra da saia: atrasa contra o quadril (mola do sway.off), no espaço do quadril; nunca para dentro das pernas (só para fora/trás)
    const q = skirt.getWorldQuaternion(new THREE.Quaternion()).invert();
    skirtOff.value.copy(sway.off).multiplyScalar(1.6).applyQuaternion(q);
  }
  // papo: mola em direção ao estágio pedido
  const manual = +$('#papo').value; const goal = Math.max(papoTarget, manual);
  for (let i = 0; i < 6; i++) { const h = dt / 6; papoVel += ((goal - papoNow) * 90 - papoVel * 11) * h; papoNow += papoVel * h; }
  papoNow = Math.max(0, papoNow); $('#papoV').textContent = papoNow.toFixed(2);
  papoNow = Math.min(papoNow, 4 * (1 - Math.min(1, mouthOpenU.value * 3)));   // boca aberta: papo murcho
  layoutPapo(papoNow + (papoNow > 0.3 ? 0.08 * Math.sin(clock.elapsedTime * 9) * Math.min(1, papoNow) : 0), sway.papoW);   // pulsa enquanto cheio
  placeFace();
  if (crabEyeMesh) { const t = crabEyeMesh.userData.tex[shownFace === 'ko' ? 'ko' : 'normal']; if (crabEyeMesh.material.map !== t) crabEyeMesh.material.map = t; }   // pupila desenhada; no K.O. vira X
  if (CHAR.crabEye && !crabEyeMesh) {   // olho animado no globo do olho de siri (projetado nele, gira com a cabeça)
    // pupila do olho de siri desenhada (a da textura foi apagada por pintar_olho_siri.py); no K.O. vira um X
    const xTex = faceCanvas(g => { g.strokeStyle = INK;
      g.lineWidth = 14; g.lineCap = 'round'; g.beginPath(); g.moveTo(36, 36); g.lineTo(92, 92); g.moveTo(92, 36); g.lineTo(36, 92); g.stroke(); });
    const pupilTex = faceCanvas(g => { g.fillStyle = INK; g.beginPath(); g.arc(64, 64, 40, 0, 7); g.fill(); g.fillStyle = '#ffffff'; g.beginPath(); g.arc(76, 52, 9, 0, 7); g.fill(); });
    crabEyeMesh = new THREE.Mesh(new THREE.BufferGeometry(), planeMat(pupilTex));
    crabEyeMesh.userData.tex = { normal: pupilTex, ko: xTex };
    bones.Head.add(crabEyeMesh);
    $('#crabEyeCtl').style.display = '';
    const E = CHAR.crabEye;
    $('#ceX').value = E.dx || 0; $('#ceY').value = E.dy || 0; $('#ceS').value = E.size;
    const build = () => {   // ↔ e ↕ em metros a partir do centro do globo; o olho é projetado na superfície dele
      const w = new THREE.Vector3(E.pos[0] + +$('#ceX').value, E.pos[1] + +$('#ceY').value, E.pos[2]);
      const c = w.applyMatrix4(new THREE.Matrix4().copy(headRest).invert()), sz = +$('#ceS').value;
      crabEyeMesh.geometry.dispose(); crabEyeMesh.geometry = decal(c, sz, sz, 10, 10, 0.004).g;
    };
    for (const id of ['ceX', 'ceY', 'ceS']) { const el = $('#' + id), sp = el.nextElementSibling; const upd = () => { sp.textContent = (+el.value).toFixed(3); build(); }; el.addEventListener('input', upd); sp.textContent = (+el.value).toFixed(3); }
    build();
  }
  // expressão de esforço: carregando = raiva e dentes rangendo; acumulando língua/lama = olhos serrados
  const want = hit ? null : charge && charge.t > 0.15 ? 'grit' : tellPose() > 0.25 ? 'squint' : face;
  if (want && want !== shownFace) { shownFace = want; eyeL.material.map = eyeR.material.map = faceTex[want].eye; if (eyesDecal) { eyesDecal[0].material.map = faceTex[want].eyeA; eyesDecal[1].material.map = faceTex[want].eyeB; } mouth.material.map = faceTex[want].mouth; }
  const open = Math.max(+$('#mouthOpen').value, tongueAnim(dt), spitAnim(dt));
  mouthRoundU.value = mouthRound;
  mudUpdate(dt); swayUpdate(dt); tailUpdate(dt, clock.elapsedTime);
  mouthOpenU.value = open; mouth.visible = open < 0.06;
  // boca abrindo: o papo já esvaziou (no mesmo quadro, senão a garganta inchada atravessa a abertura)
  if (open > 0.01) { papoNow = 0; papoVel = 0; layoutPapo(0, 0); }
  if (tongueT < 0) setTongue(mouthParts.rest);
  mouthParts.tongue.visible = open > 0.01;   // de boca fechada a língua não existe (não fura o queixo)
  // coroa voando no K.O.
  if (crownFly) { crownFly.v.y -= 9.8 * dt; crown.position.addScaledVector(crownFly.v, dt); crown.rotation.x += crownFly.spin * dt; crown.rotation.z += crownFly.spin * 0.6 * dt; if (crown.position.y < 0.05) { crown.position.y = 0.05; crownFly.v.multiplyScalar(0.4); crownFly.v.y = Math.abs(crownFly.v.y) * 0.5; crownFly.spin *= 0.6; } }
  controls.update();
  draw();
}
function draw() {
  if (OUTLINE_MODE === 'tela') { renderer.setRenderTarget(rt); renderer.render(scene, camera); renderer.setRenderTarget(null); renderer.render(postScene, postCam); }
  else renderer.render(scene, camera);
}
tick();
</script>
