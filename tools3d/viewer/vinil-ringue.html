<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K.O.-RAMA · Valéria no ringue (piloto)</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #161120; color: #fff; font: 13px system-ui, sans-serif; }
  canvas { display: block; }
  #hud { position: fixed; z-index: 2; top: 12px; left: 12px; max-width: 630px; padding: 9px 11px; border: 2px solid #ffe047; border-radius: 8px; background: #161120e8; }
  #hud button { margin: 2px; }
  #look label { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; }
  #look input { width: 90px; }
  #scope { position: fixed; z-index: 2; right: 12px; bottom: 12px; max-width: 320px; padding: 9px 11px; border-radius: 6px; background: #161120e8; line-height: 1.45; }
  #scope strong { color: #ffe047; }
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
</head>
<body>
<div id="hud">Carregando Valéria…</div>
<div id="scope"><strong>Piloto visual, não é combate jogável.</strong><br>Disponíveis: parada, jab, golpe carregado, esquivas e passada.<br>Pendentes: especiais, assinatura, reação a golpes, defesa e nocaute.</div>
<script type="module">
import { runVinil } from './vinil/core.js';
import valeria from './vinil/valeria.js';
await runVinil(valeria);

const { THREE, scene, camera, controls, root } = window.VIN;
scene.background = new THREE.Color(0x110e19);
for (const object of [...scene.children]) {
  if (object.isMesh && object.geometry?.type === 'CircleGeometry') scene.remove(object);
}

const ring = new THREE.Group();
scene.add(ring);
const ink = new THREE.MeshBasicMaterial({ color: 0x11121d });
const yellow = new THREE.MeshBasicMaterial({ color: 0xffd935 });
const red = new THREE.MeshBasicMaterial({ color: 0xee3c58 });
const white = new THREE.MeshBasicMaterial({ color: 0xe6e7ed });
const apron = new THREE.Mesh(new THREE.BoxGeometry(4.5, 0.16, 4.5), ink);
apron.position.y = -0.11;
ring.add(apron);

// Quadrados simples, sem efeitos pesados, para julgar primeiro a escala do lutador.
for (let x = 0; x < 10; x++) for (let z = 0; z < 10; z++) {
  const tile = new THREE.Mesh(new THREE.PlaneGeometry(0.44, 0.44), new THREE.MeshBasicMaterial({ color: (x + z) % 2 ? 0x245540 : 0x2c654a }));
  tile.rotation.x = -Math.PI / 2;
  tile.position.set(-1.98 + x * 0.44, -0.025, -1.98 + z * 0.44);
  ring.add(tile);
}
for (const z of [-2.14, 2.14]) for (const x of [-2.14, 2.14]) {
  const post = new THREE.Mesh(new THREE.BoxGeometry(0.13, 1.58, 0.13), ink);
  post.position.set(x, 0.77, z);
  ring.add(post);
  const pad = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.48, 0.2), yellow);
  pad.position.set(x, 0.94, z);
  ring.add(pad);
}
const rope = (a, b, y, mat) => {
  const d = new THREE.Vector3().subVectors(b, a);
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.016, d.length(), 8), mat);
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
  ring.add(mesh);
};
for (const y of [0.52, 0.83, 1.14]) {
  const mat = y === 0.83 ? white : red;
  for (const z of [-2.14, 2.14]) rope(new THREE.Vector3(-2.14, y, z), new THREE.Vector3(2.14, y, z), y, mat);
  for (const x of [-2.14, 2.14]) rope(new THREE.Vector3(x, y, -2.14), new THREE.Vector3(x, y, 2.14), y, mat);
}

// O motor redefine a posicao do root a cada quadro; o deslocamento do oponente fica no pai.
const opponentAnchor = new THREE.Group();
opponentAnchor.position.z = -0.65;
scene.add(opponentAnchor);
opponentAnchor.add(root);
const view = (position, target, facing) => {
  camera.position.set(...position);
  controls.target.set(...target);
  root.rotation.y = facing;
  controls.update();
};
view([0, 2.25, 4.8], [0, 0.93, -0.4], 0);
const toolbar = document.createElement('div');
toolbar.innerHTML = '<br><button id="ringFront">Ringue: frente</button><button id="ringBack">Ringue: costas</button><button id="ringThree">Ringue: 3/4</button>';
document.querySelector('#hud').append(toolbar);
document.querySelector('#ringFront').onclick = () => view([0, 2.25, 4.8], [0, 0.93, -0.4], 0);
document.querySelector('#ringBack').onclick = () => view([0, 2.25, 4.8], [0, 0.93, -0.4], Math.PI);
document.querySelector('#ringThree').onclick = () => view([2.4, 2.1, 3.7], [0, 0.93, -0.4], 0);
</script>
</body>
</html>
